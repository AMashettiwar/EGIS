[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cancer-evidence-engine"
version = "0.1.0"
description = "Non-generative, proof-carrying public cancer metadata queries"
requires-python = ">=3.11"
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
multimodal = ["duckdb>=1.0", "pyarrow>=15.0"]
vision = ["torch>=2.1", "pillow>=10.0", "transformers>=4.40", "timm>=1.0", "huggingface_hub>=0.23"]

[project.scripts]
evidence = "cancer_evidence.cli:main"
cancer-evidence-demo = "cancer_evidence.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

